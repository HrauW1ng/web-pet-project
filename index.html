<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="page-bg" aria-hidden="true"></div>
    <main id="dashboard">

    </main>
    <aside id="dockbar" class="dockbar" aria-label="Quick Dock">
        <button class="dock-btn" id="dock-settings" title="Settings">
            <i class="fa-solid fa-gear"></i>
        </button>
        <button class="dock-btn" id="dock-theme" title="Theme">
            <i class="fa-solid fa-palette"></i>
        </button>
        <button class="dock-btn" id="dock-account" title="Account">
            <i class="fa-solid fa-user-large"></i>
        </button>
    </aside>
    <script src="script.js"></script>
</body>
</html>
